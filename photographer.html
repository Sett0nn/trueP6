                 stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
            </svg>
        </div>
        <div class="modal-content">
            <button class="modal_close">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                     stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

<header>
    <a href="http://localhost:63342/trueP6/index.html?_ijt=brkjg136nlg016e3rhiiilhhvg&_ij_reload=RELOAD_ON_SAVE"> <img src="src/assets/images/logo.png" class="logo" alt="logo fisheye" /></a>
</header>

<div class="first-part">
<div class="main-content">
    <div id="main">
        <div class="photographer-form">
            <div class="header-form">

                <div class="photograph-header">
                    <div class="style-button">
                    </div>
                </div>



            </div>

            <div class="banner-style">
                <div id="photographers-banner"></div>
            </div>

            <div id="photographers-image"></div>
        </div>
        </div>
    </div>


    <div class="sort-class">
        <div class="title-sort">Trier par</div>
        <select name="pets" id="pet-select" onchange="sortPictures(this.value)">
            <option value="likes">Popularity</option>
            <option value="date">Date</option>
            <option value="title">Title</option>
        </select>
    </div>
    <div id="container-photo">



    </div>
    <div class="photo-list"></div>
    <div id="nav-bar"></div>
</div>



<div id="contact_modal" class="modal-background" role="dialog" aria-labelledby="modal-title">
    <div class="modal-body">
    <div class="modal-content">



        <div class="modal-header">
            <h2 class="modal-titles"> </h2>
            <button class="close-modal" aria-label="Fermer">&times;</button>
        </div>
        <form id="contact-form">
            <div class="form-group">
                <label for="firstname">Prénom</label>
                <input
                        type="text"
                        id="firstname"
                        name="firstname"
                        required
                        aria-required="true"
                >
            </div>
            <div class="form-group">
                <label for="lastname">Nom</label>
                <input
                        type="text"
                        id="lastname"
                        name="lastname"
                        required
                        aria-required="true"
                >
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        aria-required="true"
                >
            </div>
            <div class="form-group">
                <label for="message">Votre message</label>
                <textarea
                        id="message"
                        name="message"
                        required
                        aria-required="true"
                ></textarea>
            </div>
            <button type="submit" class="submit-button">Envoyer</button>
        </form>
    </div>
</div>
</div>


<script src="src/data/data.js"></script>
<script src="src/scripts/pages/photographer.js"></script>
<script src="src/scripts/utils/contactForm.js"></script>

<script src="src/scripts/pages/button_modal.js"></script>
</body>
</html>
